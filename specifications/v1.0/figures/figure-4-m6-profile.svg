<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">10RIS v1.0 Figure 4 — M6 threaded mounting holes</title>
  <desc id="desc">An illustrative rail face with four M6 threaded mounting holes at the normative 15.875, 15.875, and 12.70 millimetre repeating centre-to-centre spacings. The first three mounting holes are framed as one 44.45 millimetre rack unit.</desc>
  <style>.rail{fill:#182235;stroke:#172033;stroke-width:3}.unit{fill:#eef2f6;fill-opacity:.8}.hole{fill:#fff;stroke:#c2410c;stroke-width:4}.line{stroke:#172033;stroke-width:2;fill:none}.accent{stroke:#c2410c;stroke-width:3;fill:none}.extension{stroke:#c2410c;stroke-width:3;fill:none;stroke-dasharray:8 7}.label{font:600 18px ui-monospace,SFMono-Regular,monospace;fill:#172033}.note{font:14px ui-monospace,SFMono-Regular,monospace;fill:#475569}</style>
  <rect width="1000" height="800" fill="#fff"/>
  <text x="60" y="56" class="label">10RIS v1.0 — FIGURE 4 / M6 THREADED MOUNTING HOLES / NORMATIVE</text>
  <rect x="370" y="140" width="152" height="510" class="rail" data-geometry="proportional"/>
  <rect x="335" y="189.2" width="222" height="355.6" class="unit" data-unit-group="1U" data-unit-height-mm="44.45" data-boundary-offset-mm="6.35"/>
  <circle cx="446" cy="240" r="24" class="hole" data-hole="true"/>
  <circle cx="446" cy="367" r="24" class="hole" data-hole="true"/>
  <circle cx="446" cy="494" r="24" class="hole" data-hole="true"/>
  <circle cx="446" cy="595.6" r="24" class="hole" data-hole="true"/>
  <line x1="422" y1="126" x2="470" y2="126" class="accent"/><line x1="422" y1="116" x2="422" y2="136" class="accent"/><line x1="470" y1="116" x2="470" y2="136" class="accent"/>
  <line x1="422" y1="126" x2="422" y2="216" class="extension" data-dimension-extension="true"/><line x1="470" y1="126" x2="470" y2="216" class="extension" data-dimension-extension="true"/>
  <text x="446" y="104" text-anchor="middle" class="label" data-profile-top-annotation="outside-rail">M6 THREADED</text>
  <line x1="650" y1="240" x2="650" y2="367" class="accent"/><line x1="640" y1="240" x2="660" y2="240" class="accent"/><line x1="640" y1="367" x2="660" y2="367" class="accent"/>
  <line x1="446" y1="240" x2="650" y2="240" class="extension" data-dimension-extension="true"/><line x1="446" y1="367" x2="650" y2="367" class="extension" data-dimension-extension="true"/>
  <text x="680" y="311" class="label">15.875 mm (0.625 in)</text>
  <line x1="650" y1="367" x2="650" y2="494" class="accent"/><line x1="640" y1="494" x2="660" y2="494" class="accent"/>
  <line x1="446" y1="494" x2="650" y2="494" class="extension" data-dimension-extension="true"/>
  <text x="680" y="438" class="label">15.875 mm (0.625 in)</text>
  <line x1="650" y1="494" x2="650" y2="595.6" class="accent"/><line x1="640" y1="595.6" x2="660" y2="595.6" class="accent"/>
  <line x1="446" y1="595.6" x2="650" y2="595.6" class="extension" data-dimension-extension="true"/>
  <text x="680" y="553" class="label">12.70 mm (0.500 in)</text>
  <line x1="285" y1="189.2" x2="285" y2="544.8" class="line"/><line x1="275" y1="189.2" x2="295" y2="189.2" class="line"/><line x1="275" y1="544.8" x2="295" y2="544.8" class="line"/>
  <line x1="285" y1="189.2" x2="335" y2="189.2" class="extension" data-dimension-extension="true"/><line x1="285" y1="544.8" x2="335" y2="544.8" class="extension" data-dimension-extension="true"/>
  <text x="260" y="367" text-anchor="middle" transform="rotate(-90 260 367)" class="label">44.45 mm (1.750 in) / 1U</text>
  <text x="60" y="744" class="note">Rail-face width is illustrative; 10RIS does not specify rail thickness, material, or construction.</text>
