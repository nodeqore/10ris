<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">10RIS v1.0 Figure 1 — horizontal mounting interface</title>
  <desc id="desc">The normative front mounting interface shows the maximum panel width, nominal rail mounting-hole centre-to-centre spacing, and minimum clear opening.</desc>
  <style>
    .panel{fill:#eef2f6;stroke:#172033;stroke-width:3}.rail{fill:#182235;stroke:#172033;stroke-width:2}.slot{fill:#fff;stroke:#c2410c;stroke-width:3}.line{stroke:#172033;stroke-width:2;fill:none}.accent{stroke:#c2410c;stroke-width:3;fill:none}.extension{stroke:#c2410c;stroke-width:3;fill:none;stroke-dasharray:8 7}.label{font:600 17px ui-monospace,SFMono-Regular,monospace;fill:#172033}.note{font:14px ui-monospace,SFMono-Regular,monospace;fill:#475569}
  </style>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="60" y="56" class="label">10RIS v1.0 — FIGURE 1 / HORIZONTAL MOUNTING INTERFACE / NORMATIVE</text>

  <rect x="219" y="270" width="762" height="100" class="panel"/>
  <rect x="219" y="240" width="47.625" height="160" class="rail"/>
  <rect x="933.375" y="240" width="47.625" height="160" class="rail"/>
  <circle cx="245.2125" cy="320" r="9" class="slot"/>
  <circle cx="954.7875" cy="320" r="9" class="slot"/>

  <line x1="245.2125" y1="150" x2="954.7875" y2="150" class="accent" data-dimension="rail-centres" data-mm="236.525" data-px="709.575"/>
  <line x1="245.2125" y1="140" x2="245.2125" y2="160" class="accent"/><line x1="954.7875" y1="140" x2="954.7875" y2="160" class="accent"/>
  <line x1="245.2125" y1="160" x2="245.2125" y2="240" class="extension"/><line x1="954.7875" y1="160" x2="954.7875" y2="240" class="extension"/>
  <text x="600" y="128" text-anchor="middle" class="label">236.525 mm (9.312 in nominal) RAIL-HOLE CENTRE-TO-CENTRE SPACING</text>

  <line x1="219" y1="430" x2="981" y2="430" class="line" data-dimension="panel-width" data-mm="254" data-px="762"/>
  <line x1="219" y1="370" x2="219" y2="440" class="extension"/><line x1="981" y1="370" x2="981" y2="440" class="extension"/>
  <text x="600" y="462" text-anchor="middle" class="label">254.00 mm (10.000 in) MAXIMUM COMPATIBLE FRONT-PANEL WIDTH</text>

  <line x1="266.625" y1="510" x2="933.375" y2="510" class="accent" data-dimension="clear-opening" data-mm="222.25" data-px="666.75"/>
  <line x1="266.625" y1="500" x2="266.625" y2="520" class="accent"/><line x1="933.375" y1="500" x2="933.375" y2="520" class="accent"/>
  <line x1="266.625" y1="400" x2="266.625" y2="520" class="extension"/><line x1="933.375" y1="400" x2="933.375" y2="520" class="extension"/>
  <text x="600" y="542" text-anchor="middle" class="label">222.25 mm (8.750 in) MINIMUM CLEAR OPENING</text>

</svg>
