name: Change proposal
description: Propose a measurable, evidence-based change for a future 10RIS version.
title: "[Proposal]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement. 10RIS changes require reproducible measurements and real installation evidence. A proposal does not change any published version unless it is adopted in a later release.
  - type: input
    id: version
    attributes:
      label: Baseline specification version
      description: Identify the published version your proposal would change or clarify.
      placeholder: v1.0
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Affected section or figure
      description: Cite the exact section, table row, figure, or requirement.
      placeholder: "Section 4, Mounting Profiles"
    validations:
      required: true
  - type: dropdown
    id: proposal_type
    attributes:
      label: Proposal type
      options:
        - Clarify existing wording
        - Correct a technical error
        - Add a measurable requirement
        - Remove or relax a requirement
        - Add non-normative guidance
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: State the interoperability problem, relevant hardware configurations, measured values and units, and measurement method.
      placeholder: Describe the problem and the evidence that demonstrates it.
    validations:
      required: true
  - type: textarea
    id: wording
    attributes:
      label: Proposed wording or drawing change
      description: Supply exact replacement or added wording. Attach revised drawing material where relevant.
      placeholder: "Replace ... with ..."
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Explain the expected effect on existing 10RIS implementations and why it remains measurable.
      placeholder: Describe affected implementations, trade-offs, and compatibility consequences.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for a substantially similar proposal.
          required: true
        - label: I understand that only a published later version can change 10RIS requirements.
          required: true
